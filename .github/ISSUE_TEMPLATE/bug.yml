name: Bug
description: Report a broken link, browsing issue or API problem.
title: '[Bug] '
body:
  - type: input
    id: url
    attributes:
      label: Page or API URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device or client
