name: Source
description: Submit an original documented output or a provenance correction.
title: '[Source] '
body:
  - type: input
    id: source
    attributes:
      label: Original public source
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Output, attribution and dates
      description: Include source-reported model, author, actual output, prompt/settings and date precision when available.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: License, duplicates or corrections
      description: Link an existing pelicanmap record when relevant; do not upload private material.
